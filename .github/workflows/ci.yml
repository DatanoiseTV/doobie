# Fast PR / branch CI: builds Doobie on macOS + Linux + Windows, runs the unit
# tests.
# No signing, no notarization — just the proof that main and proposed merges
# compile clean on both platforms. The full release pipeline
# (signed/notarized .pkg + uploaded artefacts) lives in release.yml and runs
# on main pushes + tags.

name: ci

on:
  pull_request:
  push:
    branches: [ '**' ]    # includes main so we always get a fast CI signal even
                          # if release.yml's signing stage fails on missing secrets.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-22.04, ubuntu-24.04, windows-2022 ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: install linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # webkit2gtk 4.1 (modern, libsoup-3) is mandatory on every Ubuntu
          # we support. webkit2gtk 4.0 (legacy, libsoup-2) is only available
          # on 22.04; Noble (24.04) and newer dropped the 4.0 package. We
          # install 4.0 *only on 22.04* so JUCE can produce a binary that
          # also runtime-dlopens the legacy SO for users still on old distros.
          sudo apt-get update
          UBUNTU_VER=$(. /etc/os-release; echo "$VERSION_ID")
          PKGS=(libasound2-dev libjack-jackd2-dev
                libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev
                libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
                libwebkit2gtk-4.1-dev libsoup-3.0-dev
                libglu1-mesa-dev mesa-common-dev libgtk-3-dev ninja-build)
          if [[ "$UBUNTU_VER" == "22.04" ]]; then
              PKGS+=(libwebkit2gtk-4.0-dev libsoup2.4-dev)
          fi
          sudo apt-get install -y "${PKGS[@]}"

      - name: install macos deps
        if: matrix.os == 'macos-14'
        run: brew install ninja

      # Windows: put MSVC (cl.exe, link.exe, rc.exe) on PATH so the same
      # single-config Ninja invocation works as on macOS/Linux. Ninja itself
      # ships preinstalled on the windows runners.
      - name: set up msvc environment
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # JUCE's FindWebView2 does NOT fetch the SDK — it expects the
      # Microsoft.Web.WebView2 NuGet package on disk and hard-fails configure
      # otherwise (NEEDS_WEBVIEW2 TRUE). Version pinned to the one JUCE's own
      # error message recommends.
      - name: install webview2 sdk
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 \
                -OutputDirectory webview2-sdk -NonInteractive
          echo "WEBVIEW2_DIR=$(cygpath -m "$PWD/webview2-sdk")" >> "$GITHUB_ENV"

      - name: configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDOOBIE_INSTALL_LOCAL=OFF
          ${WEBVIEW2_DIR:+-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$WEBVIEW2_DIR}

      - name: build
        # State tests need the full Doobie target which cascades juce_gui_extra
        # sources into the test compile -- works on Apple/Win but on Linux
        # requires the WebKit subprocess-helper-binary-data header from
        # juceaide, which the test target doesn't get. Skip on any Linux.
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            cmake --build build --target Doobie_All Doobie_CLAP doobie_tests -j
          else
            cmake --build build --target Doobie_All Doobie_CLAP doobie_tests doobie_state_tests doobie_preset_tests -j
          fi

      - name: tests
        shell: bash
        run: ctest --test-dir build --output-on-failure
