# Fast PR / branch CI: builds Doobie on macOS + Linux, runs the unit tests.
# No signing, no notarization — just the proof that main and proposed merges
# compile clean on both platforms. The full release pipeline
# (signed/notarized .pkg + uploaded artefacts) lives in release.yml and runs
# on main pushes + tags.

name: ci

on:
  pull_request:
  push:
    branches: [ '**' ]    # includes main so we always get a fast CI signal even
                          # if release.yml's signing stage fails on missing secrets.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: install linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # Both webkit2gtk 4.0 (legacy/libsoup-2) and 4.1 (modern/libsoup-3)
          # so JUCE's pkg-config picks 4.1 (preferred) at build time and the
          # produced binary dlopens whichever the user's distro has. Without
          # 4.1 in the build env JUCE compiles a 4.0-only binary that breaks
          # on Ubuntu 24.04+ / Fedora 40+ / Debian 13+ / Arch (all 4.1-only).
          # WebKitGTK upstream drops libsoup2 in 2.52.0 (March 2026) -- 4.0
          # itself becomes a ghost package soon after, so 4.1 is the future.
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev \
            libsoup-3.0-dev libsoup2.4-dev \
            libglu1-mesa-dev mesa-common-dev libgtk-3-dev ninja-build

      - name: install macos deps
        if: matrix.os == 'macos-14'
        run: brew install ninja

      - name: configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDOOBIE_INSTALL_LOCAL=OFF

      - name: build
        # State tests need the full Doobie target which cascades juce_gui_extra
        # sources into the test compile -- works on Apple/Win but on Linux
        # requires the WebKit subprocess-helper-binary-data header from
        # juceaide, which the test target doesn't get. Skip on any Linux.
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            cmake --build build --target Doobie_All doobie_tests -j
          else
            cmake --build build --target Doobie_All doobie_tests doobie_state_tests -j
          fi

      - name: tests
        run: ctest --test-dir build --output-on-failure
