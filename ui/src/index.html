<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doobie</title>
  <link rel="stylesheet" href="doobie.css" />
  <style>
    /* Diagnostic banner — shown until the React app mounts. If the user
       sees a white window with no banner, the HTML itself never loaded
       (resource-provider / custom-scheme issue). If they see the banner
       but later stages don't tick, we know which script failed.

       Once #root has a child (= React mounted) the banner hides itself
       via CSS (so production users never see it). */
    #diag {
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 99999;
      background: oklch(0.20 0.006 60); color: #f6efe1;
      border: 1px solid oklch(0.32 0.006 60); border-radius: 8px;
      padding: 14px 16px; font: 12px/1.55 ui-sans-serif, system-ui, sans-serif;
      display: grid; grid-template-columns: 1fr; gap: 4px;
      box-shadow: 0 18px 40px -10px rgba(0,0,0,.8);
    }
    #diag .row { display: flex; align-items: center; gap: 8px; opacity: 0.5; }
    #diag .row.ok { opacity: 1; }
    #diag .row.ok .tick { color: #6ec77a; }
    #diag .row .tick { width: 14px; display: inline-block; text-align: center; }
    #diag .row.ok .tick::before { content: "✓"; }
    #diag .row:not(.ok) .tick::before { content: "·"; }
    #diag .err {
      background: #2a0e10; color: #ffb3b3; border-top: 1px solid #5a1c20;
      margin: 8px -16px -14px; padding: 10px 16px; border-radius: 0 0 7px 7px;
      font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: 11px;
      white-space: pre-wrap; word-break: break-word; display: none;
    }
    #diag .err.on { display: block; }
    /* Once React mounts (root has children), hide the banner. */
    body:has(#root > *) #diag { display: none; }
    /* Fit-to-window scaling drives `#plugin` (the actual 1520x960 UI
       container, defined in doobie.css). `#stage` already uses
       `place-items: center` to centre `#plugin` in the viewport, so
       we only need to apply a uniform scale — the centering is done
       in CSS. doobie.css sets `#plugin { transform-origin: center
       center }` which keeps the painted output centred on the layout
       box's centre regardless of scale. */
  </style>
</head>
<body>
  <div id="diag" aria-live="polite">
    <div class="row ok" id="d-html"><span class="tick"></span>HTML loaded</div>
    <div class="row" id="d-juce"><span class="tick"></span>juce bridge</div>
    <div class="row" id="d-react"><span class="tick"></span>React</div>
    <div class="row" id="d-babel"><span class="tick"></span>Babel</div>
    <div class="row" id="d-mount"><span class="tick"></span>App mounted</div>
    <div class="err" id="d-err"></div>
  </div>
  <div id="root"></div>

  <script>
    var ok = (id) => { var e = document.getElementById(id); if (e) e.classList.add('ok'); };
    var fail = (msg) => {
      var e = document.getElementById('d-err');
      if (e) { e.textContent = msg; e.classList.add('on'); }
    };
    window.addEventListener('error',           (e) => fail('JS error: ' + (e.message || e.error) + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?')));
    window.addEventListener('unhandledrejection', (e) => fail('unhandled rejection: ' + e.reason));
    // Fit-to-window: target `#plugin` (the 1520x960 UI container; see
    // doobie.css). transform: scale() makes browsers translate
    // pointer events through the matrix, so clicks and drags still
    // land on the correct widget. transform-origin is already
    // center-center on #plugin so we only need the scale factor.
    //
    // The element doesn't exist until React mounts, so we poll for
    // it on the first run, and re-bind once mounted. Multiple resize
    // triggers — DOM 'resize', plus a ResizeObserver on the body
    // (catches the case where JUCE sets WebView bounds from C++
    // without bubbling a window 'resize' event).
    (function () {
      var DESIGN_W = 1520;
      var lastW = 0, lastH = 0, lastPH = 0;
      function fit() {
        var el = document.getElementById('plugin');
        if (!el) return;
        var w = window.innerWidth  || document.documentElement.clientWidth;
        var h = window.innerHeight || document.documentElement.clientHeight;
        if (!w || !h) return;
        // Design height is the plugin's NATURAL rendered height, not a fixed
        // 960 — the reverb column grows/shrinks with the reverb mode. offsetHeight
        // is a layout measure unaffected by our own transform, so re-measuring
        // after scaling is stable (no feedback loop).
        var designH = el.offsetHeight || 960;
        lastW = w; lastH = h; lastPH = designH;
        var s = Math.min(w / DESIGN_W, h / designH);
        el.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
      window.addEventListener('DOMContentLoaded', fit);
      // Body covers the WebView area; observe it so we re-fit when
      // JUCE sets the bounds from C++.
      if (typeof ResizeObserver === 'function') {
        try { new ResizeObserver(fit).observe(document.body); } catch (_) {}
      }
      // #plugin is React-mounted; retry until it exists, then settle. Once it's
      // there, observe IT too so a reverb-mode change (which changes the column
      // height) re-fits — the body observer above can't see that, since body
      // stays a fixed 100% of the WebView.
      var pluginRO = null;
      (function poll(tries) {
        var el = document.getElementById('plugin');
        if (el) {
          fit();
          if (typeof ResizeObserver === 'function' && !pluginRO) {
            try { pluginRO = new ResizeObserver(fit); pluginRO.observe(el); } catch (_) {}
          }
          return;
        }
        if (tries <= 0) return;
        setTimeout(function () { poll(tries - 1); }, 30);
      })(60);
      // Persistent watchdog: every 500 ms, if the window size OR the plugin's
      // own height disagrees with what we last fit to, re-fit. Belt-and-braces
      // for the case where JUCE's WebView setBounds() from C++ doesn't
      // bubble as a DOM 'resize' event and the ResizeObserver also
      // misses it (some engine builds do not invalidate body's layout
      // box on bounds change). Cheap — no work unless something changed.
      setInterval(function () {
        var el = document.getElementById('plugin');
        var w = window.innerWidth  || document.documentElement.clientWidth;
        var h = window.innerHeight || document.documentElement.clientHeight;
        var ph = el ? el.offsetHeight : 0;
        if (w !== lastW || h !== lastH || ph !== lastPH) fit();
      }, 500);
    })();
    // Native-app feel: kill the browser context menu + drag-select gestures.
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart',   (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
    });
  </script>

  <script src="juce-framework-frontend.js"></script>
  <script>ok('d-juce');</script>

  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script>ok('d-react');</script>

  <script src="babel.min.js"></script>
  <script>
    ok('d-babel');
    // React hooks as globals so each .jsx file can use them without re-declaring.
    window.useState    = React.useState;
    window.useEffect   = React.useEffect;
    window.useRef      = React.useRef;
    window.useCallback = React.useCallback;
    window.useMemo     = React.useMemo;
  </script>

  <script src="tape.js"></script>

  <script type="text/babel" data-presets="react" src="juce-bridge.jsx"></script>
  <script type="text/babel" data-presets="react" src="knob.jsx"></script>
  <script type="text/babel" data-presets="react" src="viz.jsx"></script>
  <script type="text/babel" data-presets="react" src="mounts.jsx"></script>
  <script type="text/babel" data-presets="react" src="panels.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
  <script type="text/babel" data-presets="react">ok('d-mount');</script>
</body>
</html>
